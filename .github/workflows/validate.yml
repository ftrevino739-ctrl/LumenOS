name: Lumen build and validation
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Qt 6 build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake pkg-config qt6-base-dev qt6-declarative-dev
      - name: Validate scripts and repository structure
        run: bash scripts/validate.sh
      - name: Configure Lumen Desktop
        run: cmake -S desktop -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build Lumen Desktop
        run: cmake --build build --parallel
      - name: Package Lumen Desktop as DEB
        run: cpack --config build/CPackConfig.cmake -G DEB
      - name: Upload Debian package
        uses: actions/upload-artifact@v4
        with:
          name: lumen-desktop-deb
          path: build/*.deb
          if-no-files-found: error
          retention-days: 30
